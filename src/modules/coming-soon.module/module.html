{% if module.items|length > 0 %}
<section{% if module.section_id %} id="{{ module.section_id|escape_attr }}"{% endif %} class="ms-section ms-section--light ms-coming-soon">
  <div class="ms-container">
    <header class="ms-section-head">
      {% if module.eyebrow %}<span class="ms-eyebrow">{{ module.eyebrow }}</span>{% endif %}
      <span class="ms-rule"></span>
      <h2 class="ms-h2">{{ module.heading }}</h2>
    </header>
    <ul class="ms-coming-soon-grid">
      {% for item in module.items %}
        <li class="ms-coming-soon-item">
          <h3 class="ms-h3">{{ item.title }}</h3>
          <p>{{ item.text }}</p>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endif %}
