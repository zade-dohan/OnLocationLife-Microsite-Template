<section{% if module.section_id %} id="{{ module.section_id|escape_attr }}"{% endif %} class="ms-section ms-section--dark ms-video-section">
  <div class="ms-container">
    <header class="ms-section-head">
      {% if module.eyebrow %}<span class="ms-eyebrow">{{ module.eyebrow }}</span>{% endif %}
      <span class="ms-rule"></span>
      <h2 class="ms-h2">{{ module.heading }}</h2>
    </header>
    {% if module.video_embed_url %}
      <div class="ms-video-wrapper">
        <iframe
          src="{{ module.video_embed_url|escape_attr }}"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
          allowfullscreen
          title="{{ module.video_title|escape_attr }}"
          loading="lazy"
        ></iframe>
      </div>
    {% endif %}
  </div>
</section>
