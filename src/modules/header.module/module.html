{# Skip link must be the first focusable element on the page. #}
<a class="skip" href="#main" aria-label="skip to main content">Skip to main content</a>

<header id="cs-navigation">
  <div class="ms-nav-inner">
    <a href="{{ module.logo_link|escape_attr }}" class="ms-logo" aria-label="{{ module.logo.alt|escape_attr }} -- back to home">
      {% if module.logo.src %}
        <img
          src="{{ module.logo.src|escape_url }}"
          alt="{{ module.logo.alt|escape_attr }}"
          width="{{ module.logo.width }}"
          height="{{ module.logo.height }}"
          decoding="async"
          loading="eager"
        />
      {% endif %}
    </a>

    <nav class="ms-nav" aria-label="Primary">
      <button
        class="ms-toggle"
        id="mobile-menu-toggle"
        aria-expanded="false"
        aria-controls="ms-nav-menu"
        aria-label="Toggle menu"
        type="button"
      >
        <span class="ms-toggle-line" aria-hidden="true"></span>
        <span class="ms-toggle-line" aria-hidden="true"></span>
        <span class="ms-toggle-line" aria-hidden="true"></span>
      </button>

      <div class="ms-nav-panel">
        <ul id="ms-nav-menu" class="ms-nav-list">
          {% for link in module.nav_links %}
            <li><a href="{{ link.href|escape_attr }}" class="ms-nav-link">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </nav>
  </div>
</header>
