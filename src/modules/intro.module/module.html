<section id="{{ module.section_id|escape_attr }}" class="cap-section cap-section--light">
  <div class="cap-container cap-intro-grid">
    <div class="cap-intro-head">
      {% if module.eyebrow %}<span class="cap-eyebrow">{{ module.eyebrow }}</span>{% endif %}
      <span class="cap-rule"></span>
      <h2 class="cap-h2">{{ module.heading }}</h2>
    </div>
    <div class="cap-intro-body">
      {% if module.lead %}<div class="cap-lead">{{ module.lead|sanitize_html }}</div>{% endif %}
      {{ module.content|sanitize_html }}
    </div>
  </div>
</section>
