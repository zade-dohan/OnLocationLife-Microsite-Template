<section id="{{ module.section_id|escape_attr }}" class="ms-section ms-section--light">
  <div class="ms-container ms-intro-grid">
    <div class="ms-intro-head">
      {% if module.eyebrow %}<span class="ms-eyebrow">{{ module.eyebrow }}</span>{% endif %}
      <span class="ms-rule"></span>
      <h2 class="ms-h2">{{ module.heading }}</h2>
    </div>
    <div class="ms-intro-body">
      {% if module.lead %}<div class="ms-lead">{{ module.lead|sanitize_html }}</div>{% endif %}
      {{ module.content|sanitize_html }}
    </div>
  </div>
</section>
